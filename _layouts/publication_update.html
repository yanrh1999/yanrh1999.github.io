---
layout: default
---
<article class="publication-update">
  <header class="post-header">
    <p class="publication-label">Publication</p>
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">Published on arXiv {{ page.date | date: "%B %-d, %Y" }}</p>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  <p class="publication-return"><a href="{{ '/publications/' | relative_url }}">&larr; View all publications</a></p>
</article>
